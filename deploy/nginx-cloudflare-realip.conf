# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYED COPY: /etc/nginx/conf.d/cloudflare-realip.conf
#
# Kept here so it is version-controlled and recoverable — deploy.sh only runs
# `nginx -t` and reloads, it never writes /etc/nginx, so this file is NOT
# installed automatically. On a rebuilt server, copy it into place by hand:
#
#   cp deploy/nginx-cloudflare-realip.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# The ranges must stay in step with the ufw rules that restrict 80/443 to
# Cloudflare. Check both against https://www.cloudflare.com/ips/
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# Restore the real client IP behind Cloudflare.
#
# Traffic reaches this origin only from Cloudflare (ufw allows 80/443 from the
# Cloudflare ranges only), so without this every request appears to come from a
# Cloudflare edge address. That was landing in the requests audit trail: every
# row in approval_logs.ip_address held an edge IP such as 162.158.216.216, so
# the trail could not show where an approval was actually made from. It also
# made the login rate limiter and the account lockout count per Cloudflare edge
# rather than per user, so one busy office shared a budget with everyone else
# behind the same edge while an attacker rotating edges got a fresh one.
#
# set_real_ip_from lists the only sources allowed to assert a client IP, so the
# CF-Connecting-IP header is honoured from Cloudflare and ignored from anywhere
# else. With the real address restored into $remote_addr, the access log,
# nginx's X-Real-IP/X-Forwarded-For headers and therefore Express's req.ip all
# become the real client automatically.
#
# Ranges: https://www.cloudflare.com/ips/ — keep in step with the ufw rules.
# ─────────────────────────────────────────────────────────────────────────────

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header    CF-Connecting-IP;
real_ip_recursive on;
